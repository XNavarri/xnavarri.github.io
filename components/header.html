<header class="sticky top-0 z-40 w-full backdrop-blur-md bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between gap-2 sm:gap-3 h-16">
        <button onclick="switchTab('about'); resetAllFilters();" aria-label="Go to Xavier Navarri's profile" class="font-bold text-sm sm:text-base tracking-tight text-slate-900 dark:text-white flex items-center gap-2 text-left min-w-0">
            <span aria-hidden="true" class="bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 w-8 h-8 shrink-0 rounded-lg flex items-center justify-center font-mono text-sm font-semibold">XN</span>
            <span class="leading-tight">Xavier Navarri</span>
        </button>

        <nav aria-label="Main navigation" class="hidden lg:flex items-center text-xs font-medium">
            <button onclick="switchTab('about'); resetAllFilters();" id="nav-about" class="nav-btn px-2 py-2 rounded-md text-indigo-800 dark:text-indigo-400 font-semibold transition-colors">Profile</button>
            <button onclick="switchTab('publications'); resetAllFilters();" id="nav-publications" class="nav-btn px-2 py-2 rounded-md text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">Publications</button>
            <button onclick="switchTab('activities'); resetAllFilters();" id="nav-activities" class="nav-btn px-2 py-2 rounded-md text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">Talks &amp; posters</button>
            <button onclick="switchTab('projects'); resetAllFilters();" id="nav-projects" class="nav-btn px-2 py-2 rounded-md text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">Research</button>
            <button onclick="switchTab('teaching'); resetAllFilters();" id="nav-teaching" class="nav-btn px-2 py-2 rounded-md text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">Experience</button>
            <button onclick="switchTab('notes'); resetAllFilters();" id="nav-notes" class="nav-btn px-2 py-2 rounded-md text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">Links</button>
        </nav>

        <div class="flex items-center gap-1 shrink-0">
            <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Switch to dark theme" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors">
                <i data-lucide="moon" id="theme-icon-dark" class="w-5 h-5"></i>
                <i data-lucide="sun" id="theme-icon-light" class="w-5 h-5 hidden"></i>
            </button>
            <button id="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-menu" class="lg:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <nav id="mobile-menu" aria-label="Mobile navigation" class="hidden lg:hidden border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 pt-2 pb-4 space-y-1">
        <button onclick="switchTab('about'); resetAllFilters(); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">Profile</button>
        <button onclick="switchTab('publications'); resetAllFilters(); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">Publications</button>
        <button onclick="switchTab('activities'); resetAllFilters(); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">Talks &amp; posters</button>
        <button onclick="switchTab('projects'); resetAllFilters(); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">Research</button>
        <button onclick="switchTab('teaching'); resetAllFilters(); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">Experience</button>
        <button onclick="switchTab('notes'); resetAllFilters(); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">Links</button>
    </nav>
</header>
